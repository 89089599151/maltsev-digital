# Сборка и публикация на GitHub Pages.
# Запускается при пуше в main или вручную (Actions → Deploy → Run workflow).
# Перед сборкой проверяет, что все данные в конфигурации подтверждены.
#
# Настройки репозитория:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → Variables:
#     SITE_URL   — например https://<логин>.github.io или https://maltsev.digital
#     BASE_PATH  — /<имя-репозитория> для адреса github.io или / для своего домена
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Проверка перед запуском
        run: npm run check:launch
      - name: Сборка
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
